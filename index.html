<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VelunVPN — Настройка</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #0f172a);
            --card-bg: var(--tg-theme-secondary-bg-color, #1e293b);
            --text-color: var(--tg-theme-text-color, #f8fafc);
            --hint-color: var(--tg-theme-hint-color, #94a3b8);
            --accent-color: var(--tg-theme-button-color, #3b82f6);
            --accent-text: var(--tg-theme-button-text-color, #ffffff);
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            box-sizing: border-box;
            text-align: center;
        }
        h2 { margin-top: 0; font-size: 22px; }
        p { color: var(--hint-color); font-size: 14px; line-height: 1.5; margin-bottom: 20px; }
        .btn {
            display: block;
            width: 100%;
            background-color: var(--accent-color);
            color: var(--accent-text);
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 12px;
            text-decoration: none;
            box-sizing: border-box;
            transition: opacity 0.2s;
        }
        .btn:active { opacity: 0.8; }
        .btn-secondary {
            background-color: transparent;
            color: var(--accent-color);
            border: 2px solid var(--accent-color);
        }
        .section-title {
            font-size: 15px;
            font-weight: 600;
            margin: 20px 0 8px 0;
            text-align: left;
            color: var(--text-color);
        }
        .key-box {
            background: rgba(0,0,0,0.2);
            padding: 10px;
            border-radius: 8px;
            word-break: break-all;
            font-family: monospace;
            font-size: 11px;
            color: var(--hint-color);
            margin: 10px 0;
            text-align: left;
            max-height: 60px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>⚡ Настройка VelunVPN</h2>
        <p id="instruction-text">Определяем ваше устройство...</p>

        <!-- Динамический блок для кнопок -->
        <div id="content-area"></div>

        <div class="section-title">Ваш ключ подписки:</div>
        <div class="key-box" id="key-display">Загрузка...</div>
        <button id="copy-btn" class="btn btn-secondary" style="margin-top: 8px; padding: 10px; font-size: 14px;">🔗 Скопировать ключ вручную</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const urlParams = new URLSearchParams(window.location.search);
        let subLink = urlParams.get('sub') || "";

        document.getElementById('key-display').innerText = subLink ? subLink : "Ключ отсутствует или не активен";

        const ua = navigator.userAgent || navigator.vendor || window.opera;
        const isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
        const isAndroid = /android/i.test(ua);
        const isMac = /Macintosh|MacIntel|MacPPC|Mac68K/.test(ua);

        const instructionText = document.getElementById('instruction-text');
        const contentArea = document.getElementById('content-area');

        if (isIOS) {
            instructionText.innerHTML = "Шаг 1: Установите приложение <b>Incy</b>.<br>Шаг 2: Нажмите кнопку импорта ключа.";
            contentArea.innerHTML = `
                <a href="https://apps.apple.com/us/app/incy/id6756943388?l=ru" class="btn btn-secondary" target="_blank">📥 Скачать Incy из App Store</a>
                <a href="incy://import/${subLink}" class="btn">🚀 Импортировать ключ в Incy</a>
            `;
        } else if (isAndroid) {
            instructionText.innerHTML = "Шаг 1: Установите приложение <b>Incy</b>.<br>Шаг 2: Нажмите кнопку импорта ключа.";
            contentArea.innerHTML = `
                <a href="https://play.google.com/store/apps/details?id=llc.itdev.incy" class="btn btn-secondary" target="_blank">📥 Скачать Incy из Google Play</a>
                <a href="incy://import/${subLink}" class="btn">🤖 Импортировать ключ в Incy</a>
            `;
        } else if (isMac) {
            instructionText.innerHTML = "Настройка для macOS:";
            contentArea.innerHTML = `
                <a href="https://apps.apple.com/app/foxray/id6448898396" class="btn btn-secondary" target="_blank">🍏 Скачать FoXray (App Store)</a>
            `;
        } else {
            // ПК (Windows)
            instructionText.innerHTML = "Шаг 1: Скачайте архив v2rayN прямо в чат бота.<br>Шаг 2: Скопируйте и добавьте ключ.";
            contentArea.innerHTML = `
                <button id="pc-download-btn" class="btn btn-secondary">💻 Скачать v2rayN (архив в ТГ)</button>
            `;
            document.getElementById('pc-download-btn').addEventListener('click', () => {
                tg.sendData("get_v2rayn");
            });
        }

        document.getElementById('copy-btn').addEventListener('click', () => {
            navigator.clipboard.writeText(subLink).then(() => {
                tg.showAlert("Ключ успешно скопирован в буфер обмена! ✨");
            });
        });
    </script>
</body>
</html>
