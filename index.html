<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VelunVPN — Настройка</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #0f172a);
            --card-bg: var(--tg-theme-secondary-bg-color, #1e293b);
            --text-color: var(--tg-theme-text-color, #f8fafc);
            --hint-color: var(--tg-theme-hint-color, #94a3b8);
            --accent-color: var(--tg-theme-button-color, #3b82f6);
            --accent-text: var(--tg-theme-button-text-color, #ffffff);
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            box-sizing: border-box;
            text-align: center;
        }
        h2 { margin-top: 0; font-size: 22px; }
        p { color: var(--hint-color); font-size: 14px; line-height: 1.5; }
        .btn {
            display: block;
            width: 100%;
            background-color: var(--accent-color);
            color: var(--accent-text);
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 16px;
            text-decoration: none;
            box-sizing: border-box;
            transition: opacity 0.2s;
        }
        .btn:active { opacity: 0.8; }
        .btn-secondary {
            background-color: transparent;
            color: var(--accent-color);
            border: 2px solid var(--accent-color);
        }
        .key-box {
            background: rgba(0,0,0,0.2);
            padding: 12px;
            border-radius: 8px;
            word-break: break-all;
            font-family: monospace;
            font-size: 12px;
            color: var(--hint-color);
            margin: 15px 0;
            text-align: left;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>⚡ Настройка VelunVPN</h2>
        <p id="instruction-text">Определяем ваше устройство...</p>

        <div class="key-box" id="key-display">Ключ не найден</div>

        <button id="action-btn" class="btn">Загрузка...</button>
        <button id="copy-btn" class="btn btn-secondary">🔗 Скопировать ключ</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const urlParams = new URLSearchParams(window.location.search);
        let subLink = urlParams.get('sub') || "";

        document.getElementById('key-display').innerText = subLink ? subLink : "Ключ отсутствует или не активен";

        const ua = navigator.userAgent || navigator.vendor || window.opera;
        const isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
        const isAndroid = /android/i.test(ua);
        const isMac = /Macintosh|MacIntel|MacPPC|Mac68K/.test(ua);

        const actionBtn = document.getElementById('action-btn');
        const instructionText = document.getElementById('instruction-text');

        if (isIOS) {
            instructionText.innerHTML = "1. Установите приложение <b>Incy</b> из App Store.<br>2. Нажмите кнопку ниже для автоматического импорта ключа.";
            actionBtn.innerText = "📲 Открыть в Incy (iOS)";
            actionBtn.onclick = () => { window.location.href = `incy://import/${subLink}`; };
        } else if (isAndroid) {
            instructionText.innerHTML = "1. Установите <b>Incy</b> из Google Play.<br>2. Нажмите кнопку ниже для автоматического импорта ключа.";
            actionBtn.innerText = "🤖 Открыть в Incy (Android)";
            actionBtn.onclick = () => { window.location.href = `incy://import/${subLink}`; };
        } else if (isMac) {
            instructionText.innerHTML = "1. Установите клиент <b>FoXray</b> из App Store.<br>2. Скопируйте ключ и добавьте его в приложение.";
            actionBtn.innerText = "🍏 Скачать FoXray";
            actionBtn.onclick = () => { window.location.href = "https://apps.apple.com/app/foxray/id6448898396"; };
        } else {
            // ПК (Windows) - запрашиваем архив прямо в чат бота
            instructionText.innerHTML = "1. Нажмите кнопку ниже, чтобы получить архив <b>v2rayN</b> прямо в чат бота.<br>2. Распакуйте и добавьте ключ.";
            actionBtn.innerText = "💻 Получить v2rayN в чат бота";
            actionBtn.onclick = () => {
                tg.sendData("get_v2rayn");
            };
        }

        document.getElementById('copy-btn').addEventListener('click', () => {
            navigator.clipboard.writeText(subLink).then(() => {
                tg.showAlert("Ключ успешно скопирован в буфер обмена! ✨");
            });
        });
    </script>
</body>
</html>
